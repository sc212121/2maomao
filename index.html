<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2maomao</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#12151b);--surface:light-dark(#fff,#1b2029);--surface2:light-dark(#f0f2f7,#252b36);--text:light-dark(#202633,#f4f6fa);--muted:light-dark(#6c7484,#aeb6c5);--border:light-dark(#e0e4ec,#343c49);--accent:light-dark(#B9D3F4,#B9D3F4);--accent2:light-dark(#E8F1FC,#2A3A4D);--good:light-dark(#1e9b68,#53c994);--bad:light-dark(#e05757,#ff7777);--shadow:0 12px 32px rgba(25,31,50,.09)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;background:var(--bg)}
header{height:70px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--surface)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:900}.header-actions{display:flex;gap:10px}
.btn{padding:10px 15px;border-radius:10px;background:var(--surface2);color:var(--text);font-weight:700}.btn.primary{background:var(--accent);color:#fff}.btn.ghost{background:transparent;border:1px solid var(--border)}.btn.small{padding:7px 10px;font-size:13px}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}aside{border-right:1px solid var(--border);background:var(--surface);padding:22px 16px}.side-title{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;margin:6px 10px 10px}.folder{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;background:transparent;color:var(--text);text-align:left;margin:3px 0}.folder:hover,.folder.active{background:var(--accent2)}.folder span:first-child{display:flex;gap:9px;align-items:center}.count{font-size:12px;color:var(--muted)}.add-folder{margin:10px;width:calc(100% - 20px);text-align:left;background:transparent;color:var(--accent);font-weight:700}
main{padding:28px;max-width:1150px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.topline{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:13px;font-weight:800}.title{font-size:30px;font-weight:850;margin:5px 0}.subtitle{color:var(--muted);font-size:14px}.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}.word-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;min-height:145px;box-shadow:var(--shadow);position:relative}.word{font-size:22px;font-weight:850}.meaning{margin-top:8px;white-space:pre-wrap;color:var(--muted);line-height:1.5}.tag{display:inline-block;margin-top:13px;padding:4px 8px;background:var(--surface2);border-radius:7px;font-size:12px;color:var(--muted)}.card-actions{position:absolute;right:12px;top:12px;display:flex;gap:5px}.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.empty{padding:60px 20px;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:16px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}.folder-wrap{display:flex;align-items:center;gap:2px}.folder-wrap .folder{flex:1}.folder-delete{width:30px;height:30px;border-radius:8px;background:transparent;color:var(--muted);font-size:18px}.folder-delete:hover{background:var(--surface2);color:var(--bad)}
.modal-back{position:fixed;inset:0;background:rgba(10,13,20,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-back.show{display:flex}.modal{width:min(560px,100%);background:var(--surface);border-radius:18px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modal h2{margin:0 0 18px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--text);outline:none}.field textarea{min-height:95px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.practice-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.mode{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;color:var(--text)}.progress{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:20px}.progress i{display:block;height:100%;background:var(--accent);width:0;transition:.25s}.phase{background:var(--accent2);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:14px;font-weight:800}.deck{background:var(--surface);border:2px solid var(--accent);border-radius:16px;min-height:190px;padding:13px;margin-bottom:14px}.deck .zone-cards{min-height:145px;align-items:center;justify-content:center}.practice-grid{display:grid;gap:14px}.zone{background:var(--surface);border:2px dashed var(--border);border-radius:16px;min-height:150px;padding:13px;transition:.2s}.zone.dragover{border-color:var(--accent);background:var(--accent2)}.zone-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.zone-name{font-weight:900;font-size:18px}.zone-desc{font-size:12px;color:var(--muted)}.zone-cards{display:flex;flex-direction:column;min-height:90px;padding-bottom:2px}.practice-card{width:220px;min-height:86px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px;box-shadow:0 6px 18px rgba(20,25,40,.08);cursor:grab;margin-top:-62px;position:relative}.deck .practice-card{margin-top:0;width:min(320px,100%);min-height:110px}.practice-card:first-child{margin-top:0}.practice-card:active{cursor:grabbing}.practice-card .front{font-weight:850;font-size:18px}.practice-card .back{display:none;margin-top:7px;color:var(--muted);white-space:pre-wrap;line-height:1.4}.practice-card.revealed .back{display:block}.hint{margin:12px 0;color:var(--muted);font-size:13px}.complete{display:none;margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:25px;text-align:center}.complete.show{display:block}.complete h2{margin:0 0 8px}.stats{display:flex;justify-content:center;gap:25px;color:var(--muted);margin:14px 0}.stat strong{display:block;color:var(--text);font-size:23px}
@media(max-width:760px){header{padding:0 15px}.layout{grid-template-columns:1fr}aside{display:flex;gap:6px;overflow:auto;padding:10px;border-right:0;border-bottom:1px solid var(--border)}.side-title{display:none}.add-folder{display:block;min-width:max-content;width:auto;margin:0;padding:9px 12px;text-align:left}.folder{min-width:max-content;margin:0;padding:9px 12px}main{padding:18px 14px}.topline{align-items:flex-start}.title{font-size:25px}.cards-grid{grid-template-columns:1fr}.practice-card{width:100%}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">咪</div>2maomao</div><div class="header-actions"><button class="btn ghost" onclick="openAddCard()">＋ 新增單字</button><button class="btn primary" onclick="showPractice()">開始練習</button></div></header>
<div class="layout">
<aside><div class="side-title">資料夾</div><button class="folder active" data-folder="all" onclick="selectFolder('all')"><span>▦ 全部單字</span><span class="count" id="allCount">0</span></button><div id="folderList"></div><button class="add-folder" onclick="addFolder()">＋ 新增資料夾</button></aside>
<main>
<section id="libraryView" class="view active"><div class="topline"><div><div class="eyebrow">VOCABULARY LIBRARY</div><div class="title" id="libraryTitle">全部單字</div><div class="subtitle">建立自己的單字卡，依資料夾整理。</div></div><button class="btn primary" onclick="openAddCard()">＋ 建立單字卡</button></div><div id="cardGrid" class="cards-grid"></div></section>
<section id="practiceView" class="view"><div class="practice-head"><div><div class="eyebrow">ABC REVIEW</div><div class="title">循環練習</div><div class="subtitle" id="practiceSubtitle">把目前牌堆的最上方卡片拖到正確區域。</div></div><select id="practiceMode" class="mode" onchange="setPracticeSide(this.value)"><option value="word">看單字 → 背意思</option><option value="meaning">看意思 → 背單字</option></select></div><div class="progress"><i id="progressBar"></i></div><div class="phase" id="phaseText">第一輪：答對 → A，答錯 → C</div><div class="hint">點擊最上方卡片查看答案；確認後把它拖到指定區域。錯誤卡會留在 C，下一輪再複習。</div><div class="deck"><div class="zone-head"><div><span class="zone-name">目前牌堆</span> <span class="zone-desc">只會顯示最上面一張</span></div><span id="deckCount">0 張</span></div><div class="zone-cards" id="deckCards"></div></div><div class="practice-grid"><div class="zone" data-zone="A"><div class="zone-head"><div><span class="zone-name">A</span> <span class="zone-desc">已熟悉</span></div><span id="countA">0 張</span></div><div class="zone-cards" id="zoneA"></div></div><div class="zone" data-zone="B"><div class="zone-head"><div><span class="zone-name">B</span> <span class="zone-desc">再複習</span></div><span id="countB">0 張</span></div><div class="zone-cards" id="zoneB"></div></div><div class="zone" data-zone="C"><div class="zone-head"><div><span class="zone-name">C</span> <span class="zone-desc">答錯／待加強</span></div><span id="countC">0 張</span></div><div class="zone-cards" id="zoneC"></div></div></div><div id="complete" class="complete"><h2>🎉 全部完成！</h2><div>所有單字都已進入 A，可以重新開始一輪。</div><div class="stats"><div class="stat"><strong id="statTotal">0</strong>總卡片</div><div class="stat"><strong id="statRounds">0</strong>輪次</div></div><button class="btn primary" onclick="restartPractice()">再練一次</button><button class="btn ghost" onclick="showLibrary()">回到單字庫</button></div></section>
</main></div></div>
<div class="modal-back" id="modal"><div class="modal"><h2 id="modalTitle">建立單字卡</h2><div class="field"><label>單字／正面</label><input id="wordInput" placeholder="例如：ubiquitous"></div><div class="field"><label>意思／背面</label><textarea id="meaningInput" placeholder="可以寫中文、英文、詞性、例句或任何語言的解釋"></textarea></div><div class="field"><label>資料夾</label><select id="folderInput"></select></div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveCard()">儲存</button></div></div></div><div class="modal-back" id="folderModal"><div class="modal"><h2>新增資料夾</h2><div class="field"><label>資料夾名稱</label><input id="newFolderInput" placeholder="例如：期中考"></div><div class="modal-actions"><button class="btn ghost" onclick="closeFolderModal()">取消</button><button class="btn primary" onclick="saveFolder()">建立</button></div></div></div>
<script>
const seedCards=[
{id:'1',word:'ubiquitous',meaning:'adj. present, appearing, or found everywhere',folder:'英文核心'},
{id:'2',word:'meticulous',meaning:'adj. very careful and precise about details',folder:'英文核心'},
{id:'3',word:'resilient',meaning:'adj. able to recover quickly from difficulties',folder:'英文核心'},
{id:'4',word:'photosynthesis',meaning:'光合作用；植物利用光能將二氧化碳和水轉換成有機物的過程',folder:'生物'},
{id:'5',word:'homeostasis',meaning:'恆定；organism maintains a stable internal environment',folder:'生物'},
{id:'6',word:'ephemeral',meaning:'adj. lasting for a very short time; 短暫的',folder:'英文核心'}];
let state=JSON.parse(localStorage.getItem('wordloop')||'null')||{cards:seedCards,folders:['英文核心','生物'],selected:'all'};
let practice={cards:[],zones:{A:[],B:[],C:[]},deck:[],round:0,phase:'initial',side:'word'};let editingId=null;
const saveState=()=>localStorage.setItem('wordloop',JSON.stringify(state));
function selectFolder(f){state.selected=f;saveState();render();showLibrary()}
function render(){renderFolders();renderLibrary();updateFolderSelect()}
function renderFolders(){const list=document.getElementById('folderList');list.innerHTML=state.folders.map(f=>`<div class="folder-wrap"><button class="folder ${state.selected===f?'active':''}" onclick="selectFolder('${esc(f)}')"><span>📁 ${esc(f)}</span><span class="count">${state.cards.filter(c=>c.folder===f).length}</span></button><button class="folder-delete" title="刪除資料夾" onclick="deleteFolder('${esc(f)}',event)">×</button></div>`).join('');document.querySelector('[data-folder="all"]').classList.toggle('active',state.selected==='all');document.getElementById('allCount').textContent=state.cards.length}
function renderLibrary(){const cards=state.selected==='all'?state.cards:state.cards.filter(c=>c.folder===state.selected);document.getElementById('libraryTitle').textContent=state.selected==='all'?'全部單字':state.selected;const grid=document.getElementById('cardGrid');grid.innerHTML=cards.length?cards.map(c=>`<article class="word-card"><div class="card-actions"><button class="icon-btn" title="編輯" onclick="openEdit('${c.id}')">✎</button><button class="icon-btn" title="刪除" onclick="deleteCard('${c.id}')">×</button></div><div class="word">${esc(c.word)}</div><div class="meaning">${esc(c.meaning)}</div><span class="tag">📁 ${esc(c.folder)}</span></article>`).join(''):`<div class="empty"><strong>還沒有單字卡</strong>建立第一張單字卡，就可以開始練習。</div>`}
function updateFolderSelect(){document.getElementById('folderInput').innerHTML=state.folders.map(f=>`<option>${esc(f)}</option>`).join('');if(state.selected!=='all')document.getElementById('folderInput').value=state.selected}
function addFolder(){document.getElementById('newFolderInput').value='';document.getElementById('folderModal').classList.add('show');setTimeout(()=>document.getElementById('newFolderInput').focus(),0)}
function closeFolderModal(){document.getElementById('folderModal').classList.remove('show')}
function saveFolder(){const n=document.getElementById('newFolderInput').value.trim();if(!n)return; if(state.folders.includes(n)){document.getElementById('newFolderInput').focus();return}state.folders.push(n);state.selected=n;saveState();closeFolderModal();render()}
function deleteFolder(name,e){e.stopPropagation();if(state.folders.length<=1)return alert('至少要保留一個資料夾。');state.cards=state.cards.filter(c=>c.folder!==name);state.folders=state.folders.filter(f=>f!==name);if(state.selected===name)state.selected='all';saveState();render()}
function openAddCard(){editingId=null;document.getElementById('modalTitle').textContent='建立單字卡';document.getElementById('wordInput').value='';document.getElementById('meaningInput').value='';updateFolderSelect();document.getElementById('modal').classList.add('show')}
function openEdit(id){const c=state.cards.find(x=>x.id===id);if(!c)return;editingId=id;document.getElementById('modalTitle').textContent='編輯單字卡';document.getElementById('wordInput').value=c.word;document.getElementById('meaningInput').value=c.meaning;updateFolderSelect();document.getElementById('folderInput').value=c.folder;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function saveCard(){const word=document.getElementById('wordInput').value.trim(),meaning=document.getElementById('meaningInput').value.trim(),folder=document.getElementById('folderInput').value;if(!word||!meaning)return alert('請填寫單字和意思。');if(editingId){Object.assign(state.cards.find(c=>c.id===editingId),{word,meaning,folder})}else state.cards.push({id:Date.now().toString(),word,meaning,folder});saveState();closeModal();render()}
function deleteCard(id){state.cards=state.cards.filter(c=>c.id!==id);saveState();render()}
function showLibrary(){document.getElementById('libraryView').classList.add('active');document.getElementById('practiceView').classList.remove('active');render()}
function showPractice(){const cards=state.selected==='all'?state.cards:state.cards.filter(c=>c.folder===state.selected);if(!cards.length)return alert('目前沒有可練習的單字。');practice.cards=shuffle(cards.map(c=>({...c})));practice.zones={A:[],B:[],C:[]};practice.deck=practice.cards.map(c=>c.id);practice.round=1;practice.phase='initial';practice.side='word';document.getElementById('practiceMode').value='word';document.getElementById('libraryView').classList.remove('active');document.getElementById('practiceView').classList.add('active');document.getElementById('complete').classList.remove('show');renderPractice()}
function setPracticeSide(v){practice.side=v;renderPractice()}
function renderPractice(){const makeCard=id=>{const c=practice.cards.find(x=>x.id===id),d=document.createElement('div');d.className='practice-card';d.draggable=true;d.dataset.id=id;d.innerHTML=`<div class="front">${esc(practice.side==='word'?c.word:c.meaning)}</div><div class="back">${esc(practice.side==='word'?c.meaning:c.word)}</div>`;d.onclick=()=>d.classList.toggle('revealed');d.ondragstart=e=>{e.dataTransfer.setData('text/plain',id);setTimeout(()=>d.classList.add('dragging'),0)};d.ondragend=()=>d.classList.remove('dragging');return d};const deckEl=document.getElementById('deckCards');deckEl.innerHTML='';if(practice.deck.length){deckEl.appendChild(makeCard(practice.deck[practice.deck.length-1]))}['A','B','C'].forEach(z=>{const el=document.getElementById('zone'+z);el.innerHTML='';practice.zones[z].forEach(id=>el.appendChild(makeCard(id)))});['A','B','C'].forEach(z=>document.getElementById('count'+z).textContent=practice.zones[z].length+' 張');document.getElementById('deckCount').textContent=practice.deck.length+' 張';const total=practice.cards.length,done=practice.zones.A.length;document.getElementById('progressBar').style.width=(done/total*100)+'%';document.getElementById('statTotal').textContent=total;document.getElementById('statRounds').textContent=practice.round;document.getElementById('practiceSubtitle').textContent=`${state.selected==='all'?'全部單字':state.selected} · ${total} 張 · 第 ${practice.round} 輪`;document.getElementById('phaseText').textContent=practice.phase==='initial'?'第一輪：答對 → A，答錯 → C':practice.phase==='CtoB'?'加強輪：答對 → B，答錯 → C':'回收輪：答對 → A，答錯 → C';document.querySelectorAll('.zone').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('dragover')};zone.ondragleave=()=>zone.classList.remove('dragover');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('dragover');moveCard(e.dataTransfer.getData('text/plain'),zone.dataset.zone)}});const deck=document.querySelector('.deck');deck.ondragover=e=>{e.preventDefault();deck.classList.add('dragover')};deck.ondragleave=()=>deck.classList.remove('dragover');deck.ondrop=e=>{e.preventDefault();deck.classList.remove('dragover');returnCard(e.dataTransfer.getData('text/plain'))};if(practice.zones.A.length===total&&total>0&&practice.deck.length===0)document.getElementById('complete').classList.add('show');else document.getElementById('complete').classList.remove('show')}
function moveCard(id,to){if(!id||!practice.deck.includes(id))return;const top=practice.deck[practice.deck.length-1];if(id!==top)return alert('請先處理牌堆最上方的卡片。');if(practice.phase==='initial'&&to!=='A'&&to!=='C')return alert('第一輪只能拖到 A 或 C。');if(practice.phase==='CtoB'&&to!=='B'&&to!=='C')return alert('加強輪只能拖到 B 或 C。');if(practice.phase==='BtoA'&&to!=='A'&&to!=='C')return alert('回收輪只能拖到 A 或 C。');practice.deck.pop();practice.zones[to].push(id);if(practice.deck.length===0)advancePhase();else renderPractice()}
function advancePhase(){if(practice.phase==='initial'){if(practice.zones.C.length){practice.phase='CtoB';practice.deck=shuffle(practice.zones.C.splice(0));}else{finishPractice();return}}else if(practice.phase==='CtoB'){if(practice.zones.C.length){practice.deck=shuffle(practice.zones.C.splice(0));}else if(practice.zones.B.length){practice.phase='BtoA';practice.deck=shuffle(practice.zones.B.splice(0));}else{finishPractice();return}}else if(practice.phase==='BtoA'){if(practice.zones.C.length){practice.phase='CtoB';practice.round++;practice.deck=shuffle(practice.zones.C.splice(0));}else if(practice.zones.B.length){practice.round++;practice.deck=shuffle(practice.zones.B.splice(0));}else{finishPractice();return}}renderPractice()}
function finishPractice(){practice.deck=[];practice.zones.A=practice.cards.map(c=>c.id);practice.round=Math.max(practice.round,1);renderPractice()}
function returnCard(id){if(practice.deck.includes(id))return;for(const z of ['A','B','C'])practice.zones[z]=practice.zones[z].filter(x=>x!==id);practice.deck.push(id);renderPractice()}
function restartPractice(){practice.zones={A:[],B:[],C:[]};practice.deck=shuffle(practice.cards.map(c=>c.id));practice.round=1;practice.phase='initial';document.getElementById('complete').classList.remove('show');renderPractice()}
function shuffle(a){return a.sort(()=>Math.random()-.5)}function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
render();
</script>
</body></html>
